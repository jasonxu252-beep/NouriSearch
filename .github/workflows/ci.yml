name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: nourisearch
          POSTGRES_PASSWORD: nourisearch_dev
          POSTGRES_DB: nourisearch
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nourisearch"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -c requirements.lock ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      # The hashes in the mappings file pin the data, so a change there is the only reason to refetch.
      - name: Restore USDA datasets
        uses: actions/cache@v4
        with:
          path: data/raw
          key: usda-${{ hashFiles('backend/data/curated/fdc_mappings.yaml') }}
      - name: Download USDA datasets
        run: python -m app.ingest download --data-dir ../data/raw
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: nourisearch
          POSTGRES_PASSWORD: nourisearch_dev
          POSTGRES_DB: nourisearch
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nourisearch"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -c requirements.lock ".[dev]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Check the typed client matches the API
        run: |
          (cd backend && python -m app.export_openapi ../frontend/openapi.json)
          (cd frontend && npm run generate:api)
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts
      - name: Lint and format
        working-directory: frontend
        run: npm run lint && npm run format:check
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Component tests
        working-directory: frontend
        run: npm test
      - name: Restore USDA datasets
        uses: actions/cache@v4
        with:
          path: data/raw
          key: usda-${{ hashFiles('backend/data/curated/fdc_mappings.yaml') }}
      - name: Load the database
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.ingest all --data-dir ../data/raw
      - name: Start the API
        working-directory: backend
        run: |
          uvicorn app.main:app --port 8000 &
          timeout 30 sh -c 'until curl --fail --silent http://localhost:8000/health/ready; do sleep 1; done'
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm run test:browser
      - name: Keep the browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Check readiness
        run: curl --fail --silent --show-error http://localhost:8000/health/ready
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
