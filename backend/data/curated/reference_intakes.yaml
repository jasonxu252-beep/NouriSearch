# How much of each nutrient a person of a given age and sex needs. FDA Daily Values are one set of
# numbers for everyone, so these come from the National Academies' Dietary Reference Intakes.
#
# Copied from the Academies' summary tables, read from the published PDFs. Each list follows the
# order of `populations`. Infants, pregnancy, and breastfeeding are not covered yet.
#
# kind says what the number is. An RDA meets the needs of nearly all healthy people in a group. An AI
# is set where the evidence cannot support an RDA. A CDRR is a limit: above it, intake is advised to
# fall. Sodium uses its CDRR rather than its AI, because sodium is a nutrient to limit.
#
# Units match nutrients.yaml, so copper is converted from micrograms and chloride from grams.
# Fat, saturated fat, cholesterol, and added sugars have no value by age and sex, so they stay on
# their FDA Daily Values.

source: nasem-dri-summary

populations:
  - child_1_3
  - child_4_8
  - male_9_13
  - male_14_18
  - male_19_30
  - male_31_50
  - male_51_70
  - male_71_plus
  - female_9_13
  - female_14_18
  - female_19_30
  - female_31_50
  - female_51_70
  - female_71_plus

intakes:
