# Maps USDA categories onto NouriSearch food groups. tests/test_usda_ingest.py checks that every
# category in the real USDA files appears here, so a new category cannot silently lose its group.

sr_categories:
  Beef Products: meat
  Lamb, Veal, and Game Products: meat
  Pork Products: meat
  Sausages and Luncheon Meats: meat
  Poultry Products: poultry
  Finfish and Shellfish Products: seafood
  Dairy and Egg Products: dairy
  Legumes and Legume Products: legumes
  Nut and Seed Products: nuts_seeds
  Vegetables and Vegetable Products: vegetables
  Fruits and Fruit Juices: fruits
  Cereal Grains and Pasta: grains
  Breakfast Cereals: grains
  Baked Products: grains
  Fats and Oils: fats_oils
  Spices and Herbs: seasonings
  Soups, Sauces, and Gravies: seasonings
  Sweets: sweets
  Snacks: snacks
  Beverages: beverages
  Baby Foods: baby_foods
  Fast Foods: mixed_dishes
  Restaurant Foods: mixed_dishes
  Meals, Entrees, and Side Dishes: mixed_dishes
  American Indian/Alaska Native Foods: other

# Some categories mix different kinds of food. A description matching a pattern moves to that group,
# so the Grains filter does not return cookies and the Fruits filter does not return juice.
sr_description_overrides:
  - {category: Dairy and Egg Products, pattern: '^eggs?\b', group: eggs}
  - {category: Fruits and Fruit Juices, pattern: '\b(juices?|nectars?)\b(?! pack)', group: beverages}
  - {category: Baked Products, pattern: '\bcrackers?\b', group: snacks}
  - category: Baked Products
    pattern: '\b(cookies?|cakes?|pies?|doughnuts?|danish|strudel|tarts?|brownies?|cream puffs?|sweet rolls?|toaster pastr\w+|ice cream cones?)\b'
    group: sweets

# These SR categories hold prepared dishes rather than single foods.
sr_dish_categories:
  - Fast Foods
  - Restaurant Foods
  - Meals, Entrees, and Side Dishes

