# Daily Values are copied from the FDA reference table cited in sources.yaml.
#
# direction follows the FDA guide: limit saturated fat, sodium, and added sugars. Encourage
# dietary fiber, vitamin D, calcium, iron, and potassium. Everything else stays neutral,
# because that guide makes no statement about it.
#
# fdc_codes are USDA nutrient numbers. The first code is preferred when a food has several.
# USDA Niacin (406) is in mg while the FDA Daily Value is in mg NE, so percent Daily Value for
# niacin is approximate.

