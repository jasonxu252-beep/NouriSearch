# swaps: reviewed replacements, tried before anything else.
#   fit: how well it works in a dish, from 1 (a stretch) to 5 (hardly noticeable).
#   to: the foods that take its place, each with grams per gram of the original.
swaps:
  # Salt. Using less is offered for every ingredient and needs no entry here.
  - from: table_salt
    to: [{food: table_salt, ratio: 0.5}, {food: lemon_juice, ratio: 0.5}]
    fit: 4
    note: Acid brings out flavor, so a dish can lose half its salt with less of a change in taste.
  - from: table_salt
    to: [{food: soy_sauce_low_sodium, ratio: 5}]
    fit: 3
    note: About five times the weight gives a similar saltiness, adds savory flavor, and adds liquid.
  - from: table_salt
    to: [{food: table_salt, ratio: 0.5}, {food: cider_vinegar, ratio: 0.5}]
    fit: 3
    note: Works best in soups, sauces, and braises. Vinegar is sharper than lemon.

  # Sauces
  - from: soy_sauce
    to: [{food: soy_sauce_low_sodium, ratio: 1}]
    fit: 5
    note: The closest swap. Often sold as "less sodium" soy sauce.
  - from: soy_sauce
    to: [{food: soy_sauce_low_sodium, ratio: 0.5}, {food: water, ratio: 0.5}]
    fit: 3
    note: Thinned for a lighter dish, with a milder flavor.
  - from: soy_sauce
    to: [{food: tamari, ratio: 1}]
    fit: 5
    note: Traditionally brewed with little or no wheat. Check the label if wheat matters.
  - from: fish_sauce
    to: [{food: soy_sauce_low_sodium, ratio: 1}]
    fit: 3
    note: Keeps the salty and savory notes, without the fermented fish flavor.
  - from: tomato_sauce
    to: [{food: tomato_puree_no_salt, ratio: 1}]
    fit: 4
    note: Thicker and less seasoned, so a little water and spice can bring it back.
  - from: canned_tomatoes
    to: [{food: canned_tomatoes_no_salt, ratio: 1}]
    fit: 5
    note: The same tomatoes without the added salt.
  - from: mayonnaise
    to: [{food: mayonnaise_light, ratio: 1}]
    fit: 4
    note: Lighter in fat, though often saltier and a little sweeter.
  - from: mayonnaise
    to: [{food: mayonnaise_low_sodium, ratio: 1}]
    fit: 4
    note: A reduced-calorie mayonnaise with much less sodium.
  - from: mayonnaise
    to: [{food: greek_yogurt_nonfat, ratio: 1}]
    fit: 3
    note: Tangier and thinner than mayonnaise. Works well in salads and dips.
  - from: sour_cream
    to: [{food: greek_yogurt_nonfat, ratio: 1}]
    fit: 4
    note: A similar tang with more protein. It can split if boiled.
  - from: sour_cream
    to: [{food: sour_cream_light, ratio: 1}]
    fit: 5
    note: Tastes much the same, with less fat.
  - from: heavy_cream
    to: [{food: half_and_half, ratio: 1}]
    fit: 4
    note: Thinner and less rich. It can curdle in a hard boil, and it will not whip.
  - from: half_and_half
    to: [{food: half_and_half_fat_free, ratio: 1}]
    fit: 3
    note: Thinner and a little sweeter.
  - from: half_and_half
    to: [{food: lowfat_milk, ratio: 1}]
    fit: 3
    note: A lighter body, and fine in coffee and many sauces.

  # Milk
  - from: whole_milk
    to: [{food: lowfat_milk, ratio: 1}]
    fit: 5
    note: Works in nearly everything, with a slightly lighter body.
  - from: whole_milk
    to: [{food: skim_milk, ratio: 1}]
    fit: 4
    note: A noticeably lighter body in sauces and desserts.
  - from: whole_milk
    to: [{food: soy_milk, ratio: 1}]
    fit: 4
    note: The plant milk closest to dairy milk in protein.
  - from: whole_milk
    to: [{food: almond_milk, ratio: 1}]
    fit: 3
    note: Much less protein and a thin body, with a faint nutty flavor.
  - from: whole_milk
    to: [{food: oat_milk, ratio: 1}]
    fit: 4
    note: Creamy and slightly sweet, with much less protein.

  # Broth
  - from: chicken_broth
    to: [{food: chicken_broth_reduced, ratio: 1}]
    fit: 5
    note: The same broth with less salt.
  - from: beef_broth
    to: [{food: beef_broth_reduced, ratio: 1}]
    fit: 5
    note: The same broth with less salt.

  # Fats
  - from: butter
    to: [{food: butter_unsalted, ratio: 1}]
    fit: 5
    note: Tastes the same apart from the salt.
  - from: butter
    to: [{food: olive_oil, ratio: 0.8}]
    fit: 3
    note: Good for sauteing and many sauces. It changes flaky baking and adds an olive note.
  - from: butter
    to: [{food: canola_oil, ratio: 0.8}]
    fit: 3
    note: Neutral in flavor. It changes the texture of flaky or creamed baking.
  - from: butter
    to: [{food: butter_unsalted, ratio: 0.5}, {food: canola_oil, ratio: 0.4}]
    fit: 4
    note: Half butter and half oil keeps some of the butter flavor with less saturated fat.
  - from: butter_unsalted
    to: [{food: butter_light_unsalted, ratio: 1}]
    fit: 3
    note: Fine on bread and in sauces. Its extra water makes it unsuitable for most baking.
  - from: butter_unsalted
    to: [{food: olive_oil, ratio: 0.8}]
    fit: 3
    note: Good for sauteing and many sauces. It changes flaky baking and adds an olive note.
  - from: table_fat
    to: [{food: canola_oil, ratio: 0.8}]
    fit: 4
    note: Neutral in flavor, with no added salt.
  - from: table_fat
    to: [{food: olive_oil, ratio: 0.8}]
    fit: 4
    note: Adds an olive note, with no added salt.
  - from: margarine
    to: [{food: canola_oil, ratio: 0.8}]
    fit: 4
    note: Neutral in flavor, with no added salt.
  - from: shortening
    to: [{food: canola_oil, ratio: 1}]
    fit: 3
    note: Good for frying and many batters. It changes flaky pastry.
  - from: vegetable_oil
    to: [{food: canola_oil, ratio: 1}]
    fit: 5
    note: A neutral oil that behaves the same way in cooking.
  - from: vegetable_oil
    to: [{food: olive_oil, ratio: 1}]
    fit: 4
    note: Adds an olive note, and light olive oil keeps it mild.
  - from: sesame_oil
    to: [{food: canola_oil, ratio: 1}]
    fit: 2
    note: Cooks the same way but loses the toasted sesame flavor.
  - from: olive_oil
    to: [{food: canola_oil, ratio: 1}]
    fit: 4
    note: Neutral in flavor, with less saturated fat.

  # Cheese
  - from: cheddar
    to: [{food: cheddar_reduced_fat, ratio: 1}]
    fit: 4
    note: Melts less smoothly, with a similar flavor.
  - from: cheddar
    to: [{food: cheddar_reduced_sodium, ratio: 1}]
    fit: 4
    note: Melts the same way and tastes less salty.
  - from: cheddar
    to: [{food: mozzarella_part_skim, ratio: 1}]
    fit: 3
    note: Melts well, with a much milder flavor.
  - from: parmesan
    to: [{food: mozzarella_part_skim, ratio: 1}]
    fit: 2
    note: Far milder, and it melts rather than adding a sharp, salty finish.
  - from: ricotta
    to: [{food: ricotta_part_skim, ratio: 1}]
    fit: 5
    note: Slightly less rich, and it works the same way in fillings.

  # Eggs
  - from: whole_egg
    to: [{food: egg_white, ratio: 1.3}]
    fit: 4
    note: About two whites per egg. Good in scrambles, and it gives less richness in baking.
  - from: whole_egg
    to: [{food: tofu_soft, ratio: 1}]
    fit: 2
    note: Works for scrambles and some baking. It does not whip or set the way eggs do.

  # Meat
  - from: ground_beef
    to: [{food: lean_ground_beef, ratio: 1}]
    fit: 5
    note: The same beef with less fat, and it can dry out if overcooked.
  - from: ground_beef
    to: [{food: ground_turkey, ratio: 1}]
    fit: 4
    note: A milder flavor. Works well in sauces, chili, and meatballs.
  - from: ground_beef
    to: [{food: lentils, ratio: 1}]
    fit: 3
    note: Common in sauces and tacos, and adds fiber. It has less protein by weight.
  - from: ground_beef
    to: [{food: black_beans, ratio: 1}]
    fit: 2
    note: Good in chili and tacos, and adds fiber. It has less protein by weight.
  - from: ground_beef
    to: [{food: tofu_firm, ratio: 1}]
    fit: 3
    note: Crumbled and browned, it takes on the sauce around it.
  - from: lean_beef
    to: [{food: chicken_breast, ratio: 1}]
    fit: 4
    note: A milder flavor with similar protein. It cooks faster.
  - from: lean_beef
    to: [{food: turkey_breast, ratio: 1}]
    fit: 4
    note: A milder flavor with similar protein.
  - from: lean_beef
    to: [{food: tofu_firm, ratio: 1}]
    fit: 3
    note: Absorbs marinades well, with much less protein by weight.
  - from: lean_beef
    to: [{food: mushrooms, ratio: 1}]
    fit: 3
    note: Keeps a savory, meaty quality, with far less protein.
  - from: chicken_breast
    to: [{food: turkey_breast, ratio: 1}]
    fit: 5
    note: Very similar in cooking and flavor.
  - from: chicken_breast
    to: [{food: tofu_firm, ratio: 1}]
    fit: 3
    note: Absorbs marinades well, with much less protein by weight.
  - from: chicken_breast
    to: [{food: chickpeas, ratio: 1}]
    fit: 3
    note: Works in curries, stews, and salads, and adds fiber.
  - from: pork_sausage
