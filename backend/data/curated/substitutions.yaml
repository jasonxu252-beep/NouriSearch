# Which ingredients can stand in for others. This is NouriSearch's editorial judgment, cited as such,
# and every entry is awaiting the owner's review. None of it comes from USDA.
#
# foods: the ingredients this file knows about.
#   records: the USDA records that are this ingredient. The first is the one offered as a replacement,
#     so it needs the most complete values. All of them can be replaced.
#   role: what it does in a dish. Foods with the same role and USDA food group are also offered for each
#     other, always below the swaps listed further down because nobody has reviewed those pairings.
#     Roles are narrow on purpose: bread and flour are both starches, and neither replaces rice.
#   diet: vegan, vegetarian, or omnivore. A hand assessment, used to filter replacements.
#   contains, may_contain: a hand assessment of the FDA's nine, adding to what the name rules find.
#     A US label is the only real authority, and the product says so.
#   flavor, texture: how prominent each attribute is, from 2 (faint) to 5 (dominant). An attribute left
#     out is not prominent. Leaving the whole group out means nobody has assessed it. Texture applies
#     only to solid foods.
#
# Potassium-based salt substitutes are left out on purpose. They can raise blood potassium to
# dangerous levels in people with kidney disease or on some blood pressure medicines, which is not
# something a recipe suggestion can screen for.
source: nourisearch-editorial

